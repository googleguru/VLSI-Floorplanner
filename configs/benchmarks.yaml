# Benchmark Registry Configuration
# Defines benchmark families, sizing mode, and acquisition notes.
# If collateral is missing, the adapter marks the entry as SKIPPED.

benchmark_families:

  # ── IPSD (Industrial Physical-design Suite Designs) ──────────────────────
  # IPSD benchmarks are typically available from ICCAD/DAC contest repositories.
  # Acquisition: download from the ICCAD 2015/2019 contest pages or ISPD archive.
  # Files needed per design: <design>.lef, <design>.def, <design>.v/.lib
  ipsd:
    base_dir: data/benchmarks/ipsd
    sizing_mode: utilization   # use util+aspect_ratio+core_space mode
    default_utilization: 0.70
    default_aspect_ratio: 1.0
    default_core_space: [2.0, 2.0, 2.0, 2.0]   # [left, bottom, right, top] in site units
    site: unit                                    # placeholder; override per design
    designs:
      - name: des3
        lef:  des3.lef
        def:  des3.def
        note: "ISPD 2015 contest benchmark"
        skip_reason: null
      - name: mgc_des_perf_1
        lef:  mgc_des_perf_1.lef
        def:  mgc_des_perf_1.def
        note: "ICCAD 2015 contest benchmark"
        skip_reason: null
      - name: mgc_fft_1
        lef:  mgc_fft_1.lef
        def:  mgc_fft_1.def
        note: "ICCAD 2015 contest benchmark"
        skip_reason: null
      - name: mgc_matrix_mult_1
        lef:  mgc_matrix_mult_1.lef
        def:  mgc_matrix_mult_1.def
        note: "ICCAD 2015 contest benchmark"
        skip_reason: null

  # ── ISCAS (ISCAS-85/89 gate-level netlists) ──────────────────────────────
  # ISCAS netlists require technology mapping and LEF/DEF generation before use.
  # Adapter pipeline: BLIF/bench → Yosys → mapped netlist → OpenROAD DEF writer
  # Files generated by adapter: <ckt>.lef (tech), <ckt>.def (placed netlist)
  iscas:
    base_dir: data/benchmarks/iscas
    sizing_mode: die_core      # use explicit die/core area mode
    default_die_area:  [0, 0, 500, 500]   # [llx, lly, urx, ury] in microns
    default_core_area: [10, 10, 490, 490]
    site: unit
    designs:
      - name: c432
        bench: c432.bench
        note: "ISCAS-85 combinational"
        skip_reason: null
