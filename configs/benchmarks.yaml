  # ── ASAP7 sample designs ─────────────────────────────────────────────────
  # ASAP7 PDK: https://github.com/The-OpenROAD-Project/asap7
  # Collateral: asap7sc7p5t_28_R.lef (standard cell LEF), asap7_tech.lef (tech)
  # Verify files exist at asap7.pdk_dir before running.
  asap7:
    base_dir: data/benchmarks/asap7
    sizing_mode: utilization
    default_utilization: 0.65
    default_aspect_ratio: 1.0
    default_core_space: [4.0, 4.0, 4.0, 4.0]
    site: asap7sc7p5t_28_R_site   # standard site name in ASAP7 LEF
    designs:
      - name: gcd
        verilog: gcd.v
        note: "GCD sample; requires ASAP7 tech+cell LEF"
        skip_reason: null
      - name: uart
        verilog: uart.v
        note: "UART sample"
        skip_reason: null

# ── Synthetic fallback designs ────────────────────────────────────────────────
# Used when benchmark collateral is absent; allows pipeline smoke-testing.
synthetic:
  enabled: true
  designs:
    - name: synth_small
      num_macros: 4
      num_stdcells: 500
      die_area: [0, 0, 200, 200]
      core_area: [5, 5, 195, 195]
      site: unit
    - name: synth_medium
      num_macros: 8
      num_stdcells: 2000
      die_area: [0, 0, 400, 400]
      core_area: [10, 10, 390, 390]
      site: unit
    - name: synth_large
      num_macros: 16
      num_stdcells: 8000
      die_area: [0, 0, 800, 800]
      core_area: [20, 20, 780, 780]
      site: unit
