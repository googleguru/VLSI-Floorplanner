# Cellular Automata Rule Configurations
# Each rule_set is a named experiment variant; best is selected by eval.

global:
  seed: 42
  grid_resolution: 64        # cells along each axis (overridable per design)
  neighborhood: moore        # "moore" | "von_neumann"
  max_generations: 200
  convergence_eps: 1e-5      # halt early if state delta < eps

# ─── Rule-set library ────────────────────────────────────────────────────────
# Each entry defines which rule families are active and their weights.
# Rules apply in phase order; within a phase all active rules fire simultaneously.

rule_sets:

  # Ablation 0: no CA (pure OpenROAD ifp baseline)
  baseline:
    enabled: false

  # Ablation 1: density equalization only
  density_only:
    enabled: true
    phases:
      - name: seed
        rules: [density_equalization]
        generations: 30
      - name: smooth
        rules: [whitespace_smoothing]
        generations: 20
    weights:
      density_equalization: 1.0
      whitespace_smoothing: 0.5

  # Ablation 2: density + connectivity
  density_connectivity:
    enabled: true
    phases:
      - name: seed
        rules: [density_equalization]
        generations: 30
      - name: cluster
        rules: [connectivity_attraction]
        generations: 40
      - name: smooth
        rules: [whitespace_smoothing]
        generations: 20
    weights:
      density_equalization: 1.0
      connectivity_attraction: 1.2
      whitespace_smoothing: 0.5

  # Ablation 3 / main method: full rule-based CA with Rule 235 placer pass
  full_ca:
    enabled: true
    phases:
      - name: seed
        rules: [density_equalization]
        generations: 20
      - name: compact
        rules: [density_equalization, connectivity_attraction]
        generations: 40
      - name: separate
        rules: [repulsion_separation]
        generations: 30
      - name: cluster
        rules: [connectivity_attraction]
        generations: 30
      - name: rule235_cleanup
        # Wolfram Rule 235: eliminate isolated density islands, connect nearby
        # clusters, preserve intentional whitespace. Run before legalization so
        # the placer (MacroAssigner) receives clean, connected density zones.
        rules: [rule_235]
        generations: 25
      - name: legalize
        rules: [boundary_regularization]
        generations: 20
      - name: smooth
        rules: [whitespace_smoothing]
        generations: 20
    weights:
      density_equalization:     1.0
      connectivity_attraction:  1.2
      repulsion_separation:     1.5
      boundary_regularization:  0.8
      whitespace_smoothing:     0.6
      rule_235:                 1.0   # applied at full weight during cleanup phase

  # ─── Per-rule isolation ablation ──────────────────────────────────────────
  # Each of the following tests a single rule in isolation (no combinations)

  single_density_only:
    enabled: true
    phases:
      - name: density_phase
        rules: [density_equalization]
        generations: 100
    weights:
      density_equalization: 1.0

  single_connectivity_only:
    enabled: true
    phases:
      - name: connectivity_phase
        rules: [connectivity_attraction]
        generations: 100
    weights:
      connectivity_attraction: 1.0

  single_separation_only:
    enabled: true
    phases:
      - name: separation_phase
        rules: [repulsion_separation]
        generations: 100
    weights:
      repulsion_separation: 1.0

  single_boundary_only:
    enabled: true
    phases:
      - name: boundary_phase
        rules: [boundary_regularization]
        generations: 100
    weights:
      boundary_regularization: 1.0

  single_smoothing_only:
    enabled: true
    phases:
      - name: smoothing_phase
        rules: [whitespace_smoothing]
        generations: 100
    weights:
      whitespace_smoothing: 1.0

  single_rule235_only:
    enabled: true
    phases:
      - name: rule235_phase
        rules: [rule_235]
        generations: 100
    weights:
      rule_235: 1.0

  # ─── Two-rule combinations (pairwise interaction testing) ────────────────
  density_connectivity:
    enabled: true
    phases:
      - name: combined_phase
        rules: [density_equalization, connectivity_attraction]
        generations: 100
    weights:
      density_equalization: 1.0
      connectivity_attraction: 1.2

  density_separation:
    enabled: true
    phases:
      - name: combined_phase
        rules: [density_equalization, repulsion_separation]
        generations: 100
    weights:
      density_equalization: 1.0
      repulsion_separation: 1.5

  connectivity_rule235:
    enabled: true
    phases:
      - name: combined_phase
        rules: [connectivity_attraction, rule_235]
        generations: 100
    weights:
      connectivity_attraction: 1.2
      rule_235: 1.0

# ─── Rule hyper-parameters ───────────────────────────────────────────────────
rule_params:
  density_equalization:
    alpha: 0.25              # fraction of excess density to redistribute
    threshold: 0.05          # minimum density difference to trigger rule

  connectivity_attraction:
    beta: 0.30               # attraction strength
    max_net_pressure: 1.0    # clamp

  repulsion_separation:
    gamma: 0.40              # repulsion strength
    min_gap_frac: 0.02       # minimum gap as fraction of core dimension

  boundary_regularization:
    margin_frac: 0.05        # target margin from die edge as fraction of core
    lambda_b: 0.35

  whitespace_smoothing:
    sigma: 1.5               # Gaussian smoothing radius (cells)
    target_utilization: 0.70 # target average utilization

  rule_235:
    threshold: 0.30          # density value considered 'active' for Rule 235
    strength: 0.20           # convergence rate toward target (isolated→0, birth→threshold)
    birth_neighbors: 1       # min active Moore neighbours for a dead cell to be born
    survival_neighbors: 1    # min active Moore neighbours for a live cell to survive

# ─── Rule search space ───────────────────────────────────────────────────────
# Used by the rule-search driver to sweep combinations.
rule_search:
  alpha_values:   [0.15, 0.25, 0.35]
  beta_values:    [0.20, 0.30, 0.40]
  gamma_values:   [0.30, 0.40, 0.50]
  neighborhood:   [moore, von_neumann]
  generations:    [100, 150, 200]
  metric:         hpwl      # optimize for: hpwl | density_variance | overlap_area
