version: "3.9"

services:

  # ── baseline run ─────────────────────────────────────────────────────────
  baseline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ca-floorplanner:latest
    volumes:
      - ../data:/workspace/data:ro
      - ../outputs:/workspace/outputs
    command:
      - "--mode"
      - "baseline"
      - "--config"
      - "configs/benchmarks.yaml"
      - "--output"
      - "outputs"
    environment:
      - PYTHONUNBUFFERED=1

  # ── full CA evaluation ────────────────────────────────────────────────────
  eval:
    image: ca-floorplanner:latest
    volumes:
      - ../data:/workspace/data:ro
      - ../outputs:/workspace/outputs
    command:
      - "--mode"
      - "full"
      - "--config"
      - "configs/benchmarks.yaml"
      - "--ca-config"
      - "configs/ca_rules.yaml"
      - "--output"
      - "outputs"

  # ── ablation study ────────────────────────────────────────────────────────
  ablation:
    image: ca-floorplanner:latest
    volumes:
      - ../data:/workspace/data:ro
      - ../outputs:/workspace/outputs
    command:
      - "--mode"
      - "ablation"
      - "--config"
      - "configs/benchmarks.yaml"
      - "--ca-config"
      - "configs/ca_rules.yaml"
      - "--output"
      - "outputs"

  # ── report generation ─────────────────────────────────────────────────────
  report:
    image: ca-floorplanner:latest
    volumes:
      - ../outputs:/workspace/outputs
      - ..:/workspace
    entrypoint: ["python", "-m", "src.report.readme_updater"]
    command:
      - "--results"
      - "outputs/tables"
      - "--figures"
      - "outputs/figures"
      - "--readme"
      - "README.md"
